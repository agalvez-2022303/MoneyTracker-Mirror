<header class="sticky top-0 z-40 border-b border-white/5 bg-[#121214]/90 backdrop-blur">
  <nav class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between px-6">
    <div class="flex items-center gap-3 text-xs font-medium sm:gap-6 sm:text-[13px]">
      <a routerLink="/dashboard" routerLinkActive="text-[#22E27A]" [routerLinkActiveOptions]="{ exact: true }"
         class="text-[#9CA3AF] transition-colors hover:text-[#22E27A]">
        Inicio
      </a>
      <a routerLink="/historial" routerLinkActive="text-[#22E27A]"
         class="hidden text-[#9CA3AF] transition-colors hover:text-[#22E27A] sm:inline">
        Historial
      </a>
      <a routerLink="/estadisticas" routerLinkActive="text-[#22E27A]"
         class="hidden text-[#9CA3AF] transition-colors hover:text-[#22E27A] sm:inline">
        Estadísticas
      </a>
      <a routerLink="/configuracion" routerLinkActive="text-[#22E27A]"
         class="text-[#9CA3AF] transition-colors hover:text-[#22E27A]">
        Configuración
      </a>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <ng-content></ng-content>
    </div>
  </nav>
</header>
